<svg xmlns="http://www.w3.org/2000/svg">

    <mask id="cutout">
        <rect width="100%" height="100%" y="0%" x="0%" fill="white"/>
        <rect width="100%" height="50%" y="25%" x="0%" fill="black"/>
        <rect width="50%" height="100%" y="0%" x="25%" fill="black"/>

    </mask>
    <rect x="0%" y="0%" width="100%" height="100%" fill="transparent" stroke="black" stroke-width="8px" mask="url(#cutout)"/>
</svg>


